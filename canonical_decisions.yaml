DEC-three-planes:
  status: decided
  question: A test needs a stand-in for a dependency it cannot provision, reset, isolate or force into a state. Where do the application's laws, the stand-ins, and the choice of which environment uses which live, so that none of them leaks into another?
  answer: |
    In three planes. LawSpec holds the business contract: the application's laws, where a dependency is an ability whose production handler is the real client library; it never mentions twins, endpoints or environments, and LawSpec knows nothing about LawTwin. LawTwin holds the stand-ins: dependency contracts as LawSpec packages, twin servers, the control plane, conformance, and record and replay; it holds no business laws and does not decide which environment uses what. Ironframe does the wiring: per environment and per dependency, whether it is real or a twin, the config service and its cloud sync, and environment attestation. The one LawSpec change is tool-neutral: `lawspec evidence` may read an environment attestation that any tool writes, and report which obligations ran against stand-ins. Decided by the owner, 2026-10-09.
  opened: 0.1.0
  decided: 0.1.0
  refs: [lawtwin-plan, lawspec]

DEC-twins-wire-level-containers:
  status: decided
  question: What is a twin, so that it drops into infrastructure that already exists?
  answer: |
    A server that speaks the dependency's own wire protocol, packaged as a container: a Containerfile per twin giving a small static image, run locally with podman and podman compose, and deployed per environment to AWS ECS Fargate, GCP Cloud Run and Azure Container Apps with OpenTofu modules. Applications reach a twin exactly as they reach the real dependency, with their usual client and their usual configuration. Decided by the owner, 2026-10-09.
  opened: 0.1.0
  decided: 0.1.0
  refs: [lawtwin-plan, containerfile, podman, podman-compose, opentofu]

DEC-dependency-contracts-in-lawspec:
  status: decided
  question: Where is a dependency's behaviour stated, apart from any business unit that uses it, and where do the knobs of simulation go?
  answer: |
    Each dependency's semantics are a LawSpec package of their own in this repository, under contracts/: Kafka's as lawtwin.kafka, and each OpenAPI service's states as a package the importer generates. A package holds abilities with laws and a stateful spec handler that is the reference model; it never names a business unit. The packages may later move to a shared contracts repository, which would start the property library planned after the first release. Simulation knobs (faults, forcing, the clock) belong to LawTwin, never to LawSpec. Decided by the owner, 2026-10-09.
  opened: 0.1.0
  decided: 0.1.0
  refs: [lawtwin-plan, lawspec]

DEC-twins-in-rust:
  status: superseded
  by: DEC-core-per-target
  question: What are twin servers written in?
  answer: |
    Rust. Each twin embeds the Rust code LawSpec generates for its contract's spec handler, so the model the laws check is the model that runs, and adds a wire layer that maps requests onto the contract's operations: the kafka-protocol crate for Kafka, hyper and axum for HTTP. Time runs on the contract's Clock and randomness on a seeded Random, so runs are deterministic and replayable. Decided by the owner, 2026-10-09.
  opened: 0.1.0
  decided: 0.1.0
  refs: [lawtwin-plan, kafka-protocol-crate]

DEC-fidelity:
  status: decided
  question: Why should anyone trust that a twin behaves like the real dependency?
  answer: |
    Four things, and nothing else. Conformance: `lawtwin conform` runs the dependency contract's laws against the real thing (the apache/kafka container, or a real API endpoint) and against the twin, and gives each twin release a conformance report and level; divergences are recorded as ledger decisions. Record and replay: a proxy records real traffic into traces, each trace is checked against the contract, then replayed through the twin, and any divergence is reported. Consumer contracts: a consumer's expectations are laws in its own LawSpec spec, written against the dependency contract package and run against both the twin and the provider. Evidence: what ran against a stand-in is reported as such. Decided by the owner, 2026-10-09.
  opened: 0.1.0
  decided: 0.1.0
  refs: [lawtwin-plan, apache-kafka-image]

DEC-typed-control-plane:
  status: decided
  question: How does a test force a twin into a state, or a fault, that the real dependency will not produce on demand?
  answer: |
    Through a typed control plane generated from each contract, reached over an admin HTTP port and the lawtwin CLI. `force` sets a state and is checked against the contract's invariants, so an impossible state is refused; `fault` draws from a declared fault set (for Kafka: broker unavailable, leader change, consumer lag, duplicate delivery, rebalance storm; for HTTP: latency, 5xx, 429 rate limits, timeouts); `advance` moves the twin's clock; `inspect` shows the state; `history` shows what the twin has done. Decided by the owner, 2026-10-09.
  opened: 0.1.0
  decided: 0.1.0
  refs: [lawtwin-plan]

DEC-first-release-scope:
  status: decided
  question: What does LawTwin 0.1 cover?
  answer: |
    Two dependencies. Kafka: the producer and consumer, with consumer groups, transactions and idempotence, faults and forcing, over the API versions librdkafka, the Java client, franz-go and kafkajs use. HTTP: services described by OpenAPI 3.x, imported into a stateful contract, with faults and forcing, record and replay, and conformance. Later tiers are on the roadmap. Decided by the owner, 2026-10-09.
  opened: 0.1.0
  decided: 0.1.0
  refs: [lawtwin-plan, lawtwin-roadmap, kafka-protocol, openapi-3-1]

DEC-vetting-deferred-to-1.0:
  status: decided
  question: LawTwin is canon-checked from its first commit, but nobody has yet judged its comments, pages, decisions and references. When are they vetted?
  answer: |
    At 1.0. canon ingest records every comment, page, decision and reference as pending; canonical_exemptions.yaml exempts each kind of material until 1.0.0, so releases before then carry the debt without signing it off, as LawSpec does with its own. The owner vets them before 1.0. Decided by the owner, 2026-10-09.
  opened: 0.1.0
  decided: 0.1.0
  refs: [canon, lawspec]

DEC-kafka-broker-and-clients:
  status: decided
  question: Kafka's guarantees span its producer, consumer, group coordinator, transactions and admin APIs, but a LawSpec handler handles one ability and keeps its own state. How does one reference model serve them all?
  answer: |
    Two layers. The Broker ability is the cluster as the wire protocol sees it, one operation per request (Produce, Fetch, ListOffsets, InitProducerId, AddPartitionsToTxn, TxnOffsetCommit, EndTxn, JoinGroup, SyncGroup, Heartbeat, LeaveGroup, OffsetCommit, OffsetFetch, and the admin requests). Its stateful spec handler `cluster` is the whole reference model, and also answers Admin and GroupCoordinator from the same state, each operation by the model's checked definition of it. Producer, Partitioner, Consumer and Transactions are client abilities; their spec handlers are clients written over Broker, holding only client state (sequences, positions, the open transaction). The handler set `reference` names all the spec handlers, so a law can run over them alone. The Kafka twin maps wire requests onto Broker, and conformance reaches a real cluster through Broker or through a real client's handlers.
  opened: 0.1.0
  decided: 0.1.0
  refs: [kafka-protocol, kip-98, kip-848]

DEC-kafka-model-scope:
  status: decided
  question: What does the 0.1 reference model of Kafka leave out?
  answer: |
    Replication, retention and time. It is one broker leading every partition with one replica, so the high watermark is the log end offset; logs are never truncated, so the log start offset is zero; groups have no session timeout, so a member leaves only by LeaveGroup. Groups follow KIP-848's coordinator-side assignment (round robin over subscribers, in member id order) rather than the classic leader-side assignors. TxnOffsetCommit does not check the group generation of KIP-447. The broker keeps five recent batches per producer and partition to recognise retries. A topic has at most 1024 partitions, and a batch at most 100000 records. Each is a candidate for a later release; leader change and lag are faults of the control plane, not states of the model.
  opened: 0.1.0
  decided: 0.1.0
  refs: [kafka-design, kip-848, kip-447, kafka-classic-group-protocol]

DEC-contract-test-shared-cluster:
  status: decided
  question: A law of the contract uses several abilities, each with its own native handler. How do the native handlers of one case reach the same cluster, and a fresh one for the next case?
  answer: |
    Through a resource. Every ability of the contract is declared `with Cluster`, and LawSpec makes each case's native handlers with the case's one Cluster, acquired by `connectCluster` and released by `disconnectCluster`. In the test project a Cluster holds the generated reference model (the `cluster` spec handler and the murmur2 partitioner, installed in a context of their own), and the native handlers answer through it or through the client spec handlers made over that context; the conformance runs connect to the Kafka twin or a real cluster instead. The laws do not rely on a fresh cluster: each creates the topic it needs and claims nothing when the topic exists, so they also hold on a long-lived real cluster. The laws' refinements shape generation (topic names from the model's regex, counts from their bounds), so the project binds no generators. This replaced, in 0.1.0, a session per thread that every handler made with no arguments shared.
  opened: 0.1.0
  decided: 0.1.0
  refs: [lawspec, kafka-murmur2]

DEC-openapi-constraints-as-validation:
  status: decided
  question: An OpenAPI schema constrains values with bounds, lengths, patterns and formats. Do the imported package's types carry those constraints?
  answer: |
    No. The types are plain, and the constraints are validation. Each constrained property a law draws gets a named refinement, so laws send valid values; each request body with a constraint gets a checked definition `valid<Type>`, and the model refuses a request that breaks one with UnprocessableEntity when the operation documents 422, otherwise BadRequest. A twin must be able to receive an invalid request and refuse it as the service does; a type that carried the constraint would reject the request before the model saw it. LawSpec also cannot yet prove a regex field contract when the model builds a record from a request (gap 23), so constraints on fields would stop the model compiling.
  opened: 0.1.0
  decided: 0.1.0
  refs: [openapi-3-0, openapi-3-1, lawspec]

DEC-openapi-resources:
  status: decided
  question: Which operations of an imported service does the reference model answer, and how does the importer find them?
  answer: |
    Those of a resource: a GET on an item path whose response is a record, with its collection's POST (create), GET of a list (list), PUT (replace, or on the collection with the key in the body), PATCH (update) and the item's DELETE. The key is the item path's last parameter, joined with the collection's own parameters in a key record; a record's field holds it when named like the parameter. A create takes the key from the body, or from a counter the service keeps when the key is an integer. Every other operation is answered by a hand-written unit the importer writes once, failing with Unmodelled until its author writes it; hand-written laws go in a unit also written once. The importer recognises only what the document shows; it does not guess how a filter, a page or one resource's effect on another behaves.
  opened: 0.1.0
  decided: 0.1.0
  refs: [openapi-3-0, openapi-3-1, swagger-petstore, github-rest-api-description]

DEC-core-per-target:
  status: decided
  question: In what language is a twin's server written, and how many servers does a twin have?
  answer: |
    A twin has a core (its server) in every LawSpec target language, each embedding the model LawSpec generates for that language: Rust first, then Go and the JVM (Java and Kotlin), then Python, JavaScript and TypeScript, and Haskell, and later the BEAM (Erlang, Elixir, Gleam), C#, F# and the other targets. Each core has its own image or native deployment; a BEAM core may deploy as an OTP release or an Erlang cluster, not only a container. Everything that is not a core is language-neutral and in the repository once: the control plane's admin API and its OpenAPI document, the twin file's fault declarations, the history format, the lawtwin command (which speaks to any core over the admin API), the golden wire session, the core conformance kit and the documentation. The repository keeps a twin's cores side by side under twins/<twin>/<language>/, with what they share under twins/<twin>/shared/. Every core takes the same options and environment. This supersedes DEC-twins-in-rust, so that each build tool and runtime a team uses has a core of its own. Decided by the owner, 2026-10-10.
  opened: 0.1.0
  decided: 0.1.0
  refs: [lawtwin-plan, lawspec]

DEC-core-conformance-kit:
  status: decided
  question: How is a core in a new language shown to be the same twin as the others?
  answer: |
    By a black-box conformance kit every core must pass, run with `make core-conformance CORE=<command or image:...>`. It reaches the core only over the Kafka protocol and the admin API. It runs the same scenarios with librdkafka, kafkajs, franz-go and the Java client; after each, it replays the core's history through the reference model and checks the contract's laws over the history and the replayed state itself, not trusting the core's own check, which must agree; it checks faults, forced states and the clock as clients see them; it checks that the same seed and requests give the same history, byte for byte; and it sends the golden session's requests and requires the golden responses and history, byte for byte, so cores agree with each other and not only with themselves. The golden session is recorded from the Rust core, the reference, with `make golden`, and every core's codec tests read its frames. Decided by the owner, 2026-10-10.
  opened: 0.1.0
  decided: 0.1.0
  refs: [librdkafka, kafkajs, franz-go, kafka-java-client, rdkafka-crate]

DEC-control-plane-api:
  status: decided
  question: How do tests and tools reach a twin's control plane, whatever the twin and whatever its core's language?
  answer: |
    Over a JSON API on HTTP, on an admin port of the twin's own (9644 by default), described by an OpenAPI 3.1 document in the repository (docs/reference/control-plane.openapi.yaml). Its resources are the twin (`/v1/twin`), the state (`GET` to inspect, `POST` to force), the faults, the clock, the history with its replay, the laws, and the seed. The lawtwin command speaks it, so the command never links a core. Every core of every twin serves the same API.
  opened: 0.1.0
  decided: 0.1.0
  refs: [openapi-3-1]

DEC-twin-file:
  status: decided
  question: Where are a twin's faults declared, and how is each fault's effect on the contract stated?
  answer: |
    In the twin file, lawtwin.json, next to the contract's lawspec-package.json; never in the contract, which knows nothing of twins. It names the contract, the ability and the spec handler the twin runs, declares each fault with its typed parameters, what changes while it is active, and its effect on each law it touches (every law not named holds), and lists what forcing a state refuses, by law. A twin refuses a fault or parameter the file does not declare. Tests check that every law the file names is a law of the contract and that every declared fault is implemented. Kafka's faults are broker-unavailable, leader-change, consumer-lag, duplicate-delivery, rebalance-storm and request-latency; a fault changes what reaches the model, when an answer is sent, or what the client is told, never what the model answers.
  opened: 0.1.0
  decided: 0.1.0
  refs: [lawtwin-plan]

DEC-force-through-operations:
  status: decided
  question: How is a forced state checked against the contract, so that an impossible state is refused?
  answer: |
    A forced state is reached through the contract's own operations, from the twin's current state, on a copy of the model: a state reached that way is a state the model can be in. Before anything is applied, the forced state is checked, and one that no sequence of operations reaches is refused with the law that forbids it (a topic's partitions only grow; offsets in a partition are dense and increasing; a new epoch fences the older producer; every partition has exactly one owner in a generation; and others). If the model refuses an operation, or the result breaks an invariant the laws state, the copy is dropped and nothing changes. Otherwise the copy becomes the state and its operations are written to the history with source force, so a forced state replays like any other.
  opened: 0.1.0
  decided: 0.1.0
  refs: [lawspec]

DEC-history-as-ability-calls:
  status: decided
  question: What does a twin's history record, and in what form?
  answer: |
    Every operation of the contract's ability the twin performed, in order, as the call it is (`produceRequest` with its topic and partition, producer tag and records) with the model's answer (`ok` and the result, or `error` and the contract's error), the twin clock and the source (wire, force, fault, coordinator), as JSON lines; and control-plane events (faults raised, cleared and ended, the clock advanced, resets) as entries of their own. Bytes are printable text or base64. A read a client repeats while it waits is written once, with the answer it got. So a history replays through a fresh model, is checked against the laws, and compares byte for byte between runs and between cores.
  opened: 0.1.0
  decided: 0.1.0
  refs: [lawspec]

DEC-twin-clock:
  status: decided
  question: How does a twin keep time, so that runs are deterministic and a test controls timeouts?
  answer: |
    On a twin clock that is frozen by default and moves only when the control plane advances it; with `--clock wall` it also follows real time. Session timeouts and faults raised for a time run on it, so advancing it past a session timeout removes the member as a timeout would. Randomness is one SplitMix64 generator seeded with the twin's seed, the only source of member and cluster ids. Waits that only protect a client from a stuck connection, a fetch's long poll and a rebalance waiting for members, run in real time and change no answer. The Kafka contract states no time, so the clock is LawTwin's, not the model's.
  opened: 0.1.0
  decided: 0.1.0
  refs: [lawtwin-plan]

DEC-embed-generated-model:
  status: decided
  question: How does the Kafka twin's Rust core run the code LawSpec generates for the contract, so that the model the laws check is the model that runs?
  answer: |
    It depends on the contract's Rust test project, the crate the contract's laws run in, generated by LawSpec branch lawspec-lawtwin (e99a0bc) and checked by `make contract-generate-check`. A build script reads the generated spec handler `cluster` and writes, for each operation of Broker, a method that calls the same typed definition with the same argument conversions over a state the core owns, and gives a raised KafkaError back as a value rather than as the panic the generated handler raises. The core can then read the state for inspect and replace it for force. The generated handler keeps its state private and has no way to return a raised failure; both are in the LawSpec gap report.
  opened: 0.1.0
  decided: 0.1.0
  refs: [lawspec, kafka-protocol-crate]

DEC-classic-groups-over-coordinator:
  status: decided
  question: The contract's group coordinator assigns partitions itself, as in KIP-848, but clients speak the classic group protocol. How does the twin serve them?
  answer: |
    By running the classic protocol's rounds over the contract's coordinator. A new or changed member starts a round; the others are told REBALANCE_IN_PROGRESS and rejoin, and commits at the current generation succeed meanwhile. When every member has rejoined, or after the rebalance wait, a member that did not rejoin leaves and each that did joins, through the contract's operations; every member learns the new generation, and the leader, the first in member id order, gets the members' metadata. A sync answers with the contract's assignment, whatever the leader proposed. Generations and assignments are always the model's, and clients need no change.
  opened: 0.1.0
  decided: 0.1.0
  refs: [kip-848, kafka-classic-group-protocol]

DEC-kafka-wire-versions:
  status: decided
  question: Which Kafka requests and versions does the twin answer?
  answer: |
    ApiVersions 0-4, Metadata 0-12, Produce 3-11, Fetch 4-12, ListOffsets 1-7, FindCoordinator 0-4, JoinGroup 0-9, SyncGroup 0-5, Heartbeat 0-4, LeaveGroup 0-5, DescribeGroups 0-5, ListGroups 0-4, OffsetCommit 2-8, OffsetFetch 1-7, InitProducerId 0-4, AddPartitionsToTxn 0-3, AddOffsetsToTxn 0-3, TxnOffsetCommit 0-3, EndTxn 0-3, CreateTopics 2-7, CreatePartitions 0-3 and DescribeConfigs 1-4: what librdkafka 2.12, the Java client 4.3, franz-go 1.22 and kafkajs 2.2 negotiate, below the versions that need topic ids in requests, fetch sessions, the KIP-848 consumer protocol or transactions version 2, which the model does not have. Record batches are format v2, in any compression.
  opened: 0.1.0
  decided: 0.1.0
  refs: [kafka-protocol, kafka-protocol-crate]

DEC-http-contract-registry:
  status: decided
  question: The HTTP twin serves any imported OpenAPI contract. Is there one core build, and one image, per contract, or one that serves any of them?
  answer: |
    One that serves any: a registry of compiled contracts. The Rust core's build script finds every contract under contracts/ that has a wire map and a generated Rust test project, and brings that project's sources in as a module of its own, since LawSpec names every test crate alike and they cannot all be dependencies; it binds each contract's reference handler, so the twin runs the code the laws check. The core serves the one contract it is started with (--contract, LAWTWIN_CONTRACT or TWIN_CONFIG). Adding a contract means importing it, generating its test project, and rebuilding. A binary per contract, chosen at build time, was considered and rejected: one image deploys anywhere, and Ironframe picks the contract by configuration.
  opened: 0.1.0
  decided: 0.1.0
  refs: [lawspec, openapi-3-1]

DEC-http-faults:
  status: decided
  question: Which faults does the HTTP twin show, and how do they stay within the contract?
  answer: |
    latency, server-error (a 5xx status), rate-limit (429 with Retry-After, in windows of the twin clock), timeout (no answer; the connection held, then closed), connection-reset and slow-body (the body a few bytes at a time), declared in each contract's twin file with their effect on each law. A fault answers in the model's place, either before the request reaches the model or, with applied=true, after the model has run it, so the client does not learn that it took effect; it never changes what the model answers. Each may be limited to an operation, a count, a probability drawn from the seed, or a time on the twin clock.
  opened: 0.1.0
  decided: 0.1.0
  refs: [lawtwin-plan]

DEC-http-refusals:
  status: decided
  question: How does the HTTP twin answer a request that breaks the document?
  answer: |
    Before the model: a body that is not JSON is refused 400, as servers do, whatever the operation documents; a missing or mistyped parameter or field, or an unknown enum value, is refused 422 when the operation documents 422 and not 400, and 400 otherwise. A value that breaks a constraint reaches the model, which refuses it as the importer wrote it. A refusal's body is the one the document gives the status, built from its schema; when the document gives none, it is {"message": "<why>"}. A path with no operation is 404, and a method the path lacks 405 with Allow.
  opened: 0.1.0
  decided: 0.1.0
  refs: [openapi-3-0, openapi-3-1]

DEC-openapi-client-twin:
  status: decided
  question: How does LawTwin check an application that serves an API, rather than one that calls it?
  answer: |
    With a simulated client, lawtwin peer http call. It walks the sequences the contract's laws are about (create, read, list, update, replace, delete, read) with values drawn from a seed, and on request sends requests that break the document, retries and duplicates writes, and hangs up before answers. It reads every answer as the model's and checks the laws over them with the same check a twin runs over its own history. It reports violations of a law, findings (what the contract forbids that is not a law, such as an invalid request accepted or answered 5xx), and problems (answers that break the document, such as an undocumented status).
  opened: 0.1.0
  decided: 0.1.0
  refs: [lawtwin-plan]

DEC-http-replay-in-contract-terms:
  status: decided
  question: When a recorded exchange is replayed through the twin, or a real service and the twin answer the same traffic, what counts as the same answer?
  answer: |
    The same status and the same answer in the contract's terms: the response read by the wire map as {"ok": value} or {"error": "<ApiError>"}, so property order, spacing and fields the document does not give are not divergences. A request the document refuses is compared by its status. A failure's body is the service's own unless the document types it, which the importer does not yet, so it is not compared. Headers other than those the contract states are not compared.
  opened: 0.1.0
  decided: 0.1.0
  refs: [lawtwin-plan]

DEC-petstore3-divergences:
  status: decided
  question: Where does the Swagger Petstore 3 reference server part from the Petstore contract, and does the twin follow it?
  answer: |
    The contract's laws hold on Petstore 3. With seed 1, two rounds, retries and invalid requests, lawtwin conform http sends 84 requests and finds 36 divergences: Petstore 3 fills in values the document does not (tags [], userStatus 0, quantity 0, complete false); writes a ship date back as 2026-12-11T11:22:33.000+00:00; overwrites a pet whose id is taken, where the model answers 422; gives an order without an id the id 0; accepts a pet without its required name; answers 500 for a user it cannot find and for POST /pet without an id; and answers a missing pet 404 with the text "Pet not found" as application/xml. A trace recorded through it replays through the twin with 19 divergences in 32 exchanges. The twin follows the contract, not Petstore 3's defaults; a test that depends on them states them in the contract's hand-written units.
  opened: 0.1.0
  decided: 0.1.0
  refs: [swagger-petstore3-server, swagger-petstore]

DEC-recorded-history:
  status: decided
  question: A proxy in front of a real Kafka broker sees requests and responses. How does what it sees become something the contract can judge?
  answer: |
    Each request and its response are kept as a frame, and decoded into the history every twin writes: the operations of the contract's Broker ability the request performed, with the real broker's answers (DEC-history-as-ability-calls). The decoder mirrors how the twin maps requests onto operations, so a recorded history and a twin's say the same thing in the same words: a produce request is one produceRequest per batch with its producer tag, a fetch one fetchRequest per partition with the records a consumer reads (markers, records below the fetch offset and, read committed, records of aborted transactions left out, as clients leave them out), a group's round is written when the leader's JoinGroup answer names its members (a member that did not rejoin leaves, with the source coordinator, and each member joins), and a topic first seen in a broker that already held it is written as its creation with the source observed. What the wire shows that no operation states, such as a retriable error or a request the contract does not model, is a note in the history, not an answer. The decoder reads only the wire, so it decodes a twin core's traffic the same way.
  opened: 0.1.0
  decided: 0.1.0
  refs: [kafka-protocol, lawtwin-plan]

DEC-recorder-negotiates-twin-versions:
  status: decided
  question: Kafka 4 offers clients newer protocols than the twin answers (KIP-848's consumer protocol, transactions version 2, fetch sessions, newer request versions). What does the recorder let clients use?
  answer: |
    What the twin answers. The recorder intersects the broker's ApiVersions answer with the twin's table (DEC-kafka-wire-versions) and drops its feature levels, so clients fall back to the classic group protocol and transactions version 1; it sends every fetch without a fetch session (KIP-227), so each names every partition it reads; and it tells clients its own address for the broker, in Metadata and FindCoordinator answers, so every connection passes through it. A trace recorded so replays through any core, and every frame decodes. The recorder speaks for one broker. This is a divergence of what is offered, not of what is answered: the newer protocols are out of the first release's scope.
  opened: 0.1.0
  decided: 0.1.0
  refs: [kip-848, kip-890, kip-227, apache-kafka-image]

DEC-recorder-control-plane:
  status: decided
  question: The core conformance kit's scenarios drive a twin's control plane (faults, forced states, the clock). How do they run against a real broker, which has none?
  answer: |
    The recorder serves LawTwin's control plane itself, over a shadow twin whose history is the recorded one and whose model is the reference model run over it. The declared faults are applied on the wire, between the client and the broker: broker-unavailable closes connections, leader-change answers NOT_LEADER_OR_FOLLOWER for the partitions it names, consumer-lag cuts fetch answers short and delays them, duplicate-delivery replaces an acknowledgement of a written batch with REQUEST_TIMED_OUT, rebalance-storm answers the leader's heartbeat REBALANCE_IN_PROGRESS so the group rebalances for real, and request-latency holds answers back. Faults raised for a time end on the recorder's clock, which advance moves. A forced state is checked on a copy of the shadow model as a twin checks it, refused with the law that forbids it, and otherwise reached by sending the broker the contract's operations, recorded with the source force; only topics, records and committed offsets of an empty group can be reached on a real broker, and anything else is refused. The history, the state and the laws are the recorder's.
  opened: 0.1.0
  decided: 0.1.0
  refs: [lawtwin-plan]

DEC-compare-up-to-renaming:
  status: decided
  question: A real broker chooses values the contract leaves to it, such as producer ids, member ids and generation numbers. When is its answer the model's?
  answer: |
    When it is equal up to a renaming of those values. When the broker hands one out (a producer id and epoch from InitProducerId, a generation from JoinGroup, a member id with MEMBER_ID_REQUIRED), the model's or the twin core's choice is noted beside it, and every later operation that carries the broker's value is run with the other side's; the epochs of a producer id keep their distance. The values handed out are not compared; everything else must be equal. Two refusals are the same when Kafka answers them with the same error code.
  opened: 0.1.0
  decided: 0.1.0
  refs: [lawtwin-plan]

DEC-replay-over-the-wire:
  status: decided
  question: How is a recorded trace replayed through a twin core, so that the core's wire layer is checked as well as its model?
  answer: |
    Over the Kafka protocol, with the recorded requests. Each recorded connection gets a connection of its own, and a request is sent once every response that came back before it in the recording has come back in the replay, so concurrent clients interleave as they did and a group's members join one round. Requests carry the core's identifiers (DEC-compare-up-to-renaming): member ids, generations, producer ids and epochs are rewritten, record batches with their checksums. Both sides' responses are decoded into the history (DEC-recorded-history) and compared frame by frame; a group's rounds are compared as a whole, since the two sides may choose another leader to answer with the members. Topics the broker already held are forced on the core first. The core's own history is then checked as the conformance kit checks it. A deliberately broken core, built with the feature mutant-ignore-dedupe, writes an idempotent retry again, and the replay catches it.
  opened: 0.1.0
  decided: 0.1.0
  refs: [lawtwin-plan]

DEC-fetch-sizing:
  status: decided
  question: Kafka sizes a fetch answer by bytes, the twin by records. Is a fetch that returns fewer or more records a divergence?
  answer: |
    No, when the records it returns agree. The decoder writes a fetch with the number of records the broker returned as its maximum, so the reference model returns the same records; a replay compares the records both sides returned up to the shorter answer, and the high watermark and last stable offset exactly. A fetch that returns records on one side and none on the other is a divergence.
  opened: 0.1.0
  decided: 0.1.0
  refs: [kafka-protocol]

DEC-retriable-errors-not-answers:
  status: decided
  question: Kafka answers some requests with errors a client retries (LEADER_NOT_AVAILABLE, NOT_LEADER_OR_FOLLOWER, COORDINATOR_LOAD_IN_PROGRESS, NOT_COORDINATOR, CONCURRENT_TRANSACTIONS, REQUEST_TIMED_OUT and the like). Are they answers of the contract?
  answer: |
    No. They say the request did not reach the log or the coordinator yet, or will be answered again, and nothing about the cluster's state; the client retries, and its retry is the operation. The decoder writes them as notes in the history, which replay and the laws skip, and the conformance report counts them by request and error.
  opened: 0.1.0
  decided: 0.1.0
  refs: [kafka-protocol]

DEC-conformance-levels:
  status: decided
  question: What does a conformance report say about a twin release, in one word?
  answer: |
    A level, the highest whose conditions every run meets. 0, unchecked: no run against the real dependency. 1, lawful: the real dependency's histories satisfy every law the kit checks, so the contract describes the real thing. 2, scenarios: also every client scenario that passes against the twin passes against the real dependency, unchanged. 3, answers: also every answer of the real dependency is the reference model's up to renaming, except divergences, and notes the wire showed, each accounted for by a ledger decision. 4, exact: level 3 with no divergence at all. `lawtwin conform kafka` writes the report as JSON and Markdown, with every run, its trace, each kind of divergence and the decision that accounts for it; a release's report is kept under twins/kafka/conformance/reports/<release>/.
  opened: 0.1.0
  decided: 0.1.0
  refs: [lawtwin-plan, apache-kafka-image]

DEC-fenced-producer-spelling:
  status: decided
  question: Conformance found that Kafka answers a fenced transactional producer INVALID_PRODUCER_EPOCH where the twin answered PRODUCER_FENCED. Who is right, and what does the twin answer?
  answer: |
    Both mean the contract's ProducerFenced; Kafka spells it by the request's version. Against apache/kafka 4.3.1, a request stamped with an epoch older than the producer's is answered INVALID_PRODUCER_EPOCH (47) by AddPartitionsToTxn, AddOffsetsToTxn and EndTxn below version 2, which predate PRODUCER_FENCED (KIP-588), and by TxnOffsetCommit at every version, and PRODUCER_FENCED (90) from version 2 of the others; librdkafka sends AddPartitionsToTxn version 0 and kafkajs version 1. The twin now answers as Kafka does, and the decoder reads Kafka's spelling back as ProducerFenced. A produce with an older epoch is InvalidProducerEpoch in the contract and 47 on the wire at every version, as before.
  opened: 0.1.0
  decided: 0.1.0
  refs: [kip-588, kip-98, apache-kafka-image]

DEC-kafka-divergence-group-assignment:
  status: decided
  question: Conformance finds that a group's members are given other partitions by real Kafka than by the contract's coordinator. Does the twin follow Kafka?
  answer: |
    No; the twin follows the contract (DEC-classic-groups-over-coordinator, DEC-kafka-model-scope). In Kafka's classic protocol the leader's assignor chooses: librdkafka's and the Java client's range assignor give two members of four partitions 0 and 1, and 2 and 3; franz-go's cooperative-sticky assignor gives a joining member nothing in its first round and moves partitions in the next. The contract's coordinator assigns round robin in member id order, as KIP-848 lets the broker do. Both give every partition exactly one owner in a generation, which the laws check on both sides. An application that depends on a particular assignor's choice is outside the contract.
  opened: 0.1.0
  decided: 0.1.0
  refs: [kip-848, kafka-classic-group-protocol, apache-kafka-image]

DEC-kafka-divergence-rebalance-heartbeat:
  status: decided
  question: Kafka answers a heartbeat REBALANCE_IN_PROGRESS both while a round waits and after a member has left, when the contract's generation has already moved on. What does the history say?
  answer: |
    That the member must rejoin, as a note, not as an answer of the contract. In Kafka's classic protocol a leave starts a round and the generation moves only when the round completes; in the contract's coordinator a leave starts a new generation at once, so the model answers such a heartbeat IllegalGeneration, which the twin also sends as REBALANCE_IN_PROGRESS. The wire does not tell the two apart, so the decoder writes the heartbeat as a note and the laws judge the round when it completes.
  opened: 0.1.0
  decided: 0.1.0
  refs: [kafka-classic-group-protocol, kip-848]

DEC-kafka-divergence-coordinator-timing:
  status: decided
  question: Conformance finds Kafka answering requests with retriable errors the twin never sends unless a fault is raised. Is that a divergence the twin should copy?
  answer: |
    No. Kafka answers COORDINATOR_LOAD_IN_PROGRESS and NOT_COORDINATOR while a coordinator loads its partition of __consumer_offsets or __transaction_state, CONCURRENT_TRANSACTIONS while the markers of the previous transaction are still being written, and LEADER_NOT_AVAILABLE while a new topic's leader is elected. The twin's model completes each operation at once, so it never does; clients retry, and the retry is the operation (DEC-retriable-errors-not-answers). A test that needs a client to see them raises the request-latency, leader-change or broker-unavailable faults. The conformance report counts each by request and error.
  opened: 0.1.0
  decided: 0.1.0
  refs: [kafka-protocol, apache-kafka-image]

DEC-kafka-divergence-auto-create:
  status: decided
  question: Kafka with auto.create.topics.enable creates a topic a Metadata request names, but answers UNKNOWN_TOPIC_OR_PARTITION until the controller has created it. The twin creates it and answers at once. Is that a divergence?
  answer: |
    Only of timing, and the twin keeps its own. The history Kafka gives, decoded, is the twin's: the topic is unknown, then created with the default partitions, then known; Kafka's takes one more Metadata request, which clients send. A replay compares a Metadata answer only where both sides know the topic, and compares the topics each side created over the whole trace.
  opened: 0.1.0
  decided: 0.1.0
  refs: [kafka-protocol, apache-kafka-image]

DEC-simulated-peers:
  status: decided
  question: How does LawTwin play the other parties on a topic: a producer an application consumes from, and a consumer of what it produces?
  answer: |
    As real clients (librdkafka), so they work against a twin and against real Kafka alike. `lawtwin peer kafka produce` sends records valid under the Kafka contract, with values drawn from a seed and, given one, generated from a LawSpec type and its refinements, at a rate, with keys, headers, idempotence, transactions, and faults a producer shows: duplicates of a lost acknowledgement, values that are not of the type, tombstones, aborted transactions, late timestamps, and a transaction left open. `lawtwin peer kafka consume` joins a group, reads committed or uncommitted, and checks what it reads against the contract's consumer-side laws (a poll reads each partition in offset order, records with one key go to one partition, read-committed fetches never see open or aborted transactions, committed records are read committed together and in order) and the value type; to tell committed records from aborted ones it reads each partition again over the wire, both ways. Each reports what it did and what broke, as JSON.
  opened: 0.1.0
  decided: 0.1.0
  refs: [librdkafka, lawtwin-plan]

DEC-peer-value-types:
  status: decided
  question: Where does a peer get the type of a topic's values, and how are values of it written into records?
  answer: |
    From LawSpec sources, read by the peer itself: `type` declarations, with refined fields, `refinement` declarations without parameters, and one-expression `definition`s a refinement calls. A refinement's comparisons bound the values generated, and a value is kept only when its whole predicate holds; the same reading checks a value read back. Values are written as JSON (a product as an object of its fields, a sum's constructor as its name or as an object of its name, Maybe as the value or null, bytes as base64) or in LawSpec's own wire encoding. A type the peer cannot read is refused with the reason; LawSpec does not yet export types for tools to read.
  opened: 0.1.0
  decided: 0.1.0
  refs: [lawspec]
