version: 0.1.0
canon: 0.2.2
registry: canonical_refs.yaml
decisions: canonical_decisions.yaml
exemptions: canonical_exemptions.yaml
vetting: canonical_vetting
ignore:
  - .canon/
  - .canon-cache/
  - "*.md"
  - "!docs/**/*.md"
  - contracts/*/test/.lawspec/
  - contracts/*/test/rust/target/
  - contracts/*/test/rust/src/lawspec_*.rs
  - contracts/*/test/rust/src/lawspec/
  - contracts/*/test/rust/tests/
  - contracts/*/test/python/.venv/
  - contracts/*/test/python/src/lawspec_*.py
  - contracts/*/test/python/src/lawspec_*/
  - contracts/*/test/python/src/lawspec/
  - contracts/*/test/python/src/*.egg-info/
  - contracts/*/test/python/tests/test_*_lawspec.py
  - contracts/*/test/python/tests/lawspec_*.py
  - contracts/*/test/go/**/lawspec_*.go
  - contracts/*/test/go/lawspec/
  - contracts/*/test/java/target/
  - contracts/*/test/java/src/main/java/lawspec/
  - contracts/*/test/java/src/test/
  - contracts/*/test/kotlin/build/
  - contracts/*/test/kotlin/.gradle/
  - contracts/*/test/kotlin/.kotlin/
  - contracts/*/test/kotlin/src/main/kotlin/lawspec/
  - contracts/*/test/kotlin/src/main/java/
  - contracts/*/test/kotlin/src/test/
  - .lawspec-cli/
  - twins/*/conformance/clients/*/node_modules/
  - twins/*/conformance/clients/*/target/
languages:
  folio:
    extensions: [.md]
    lexer: .canon/grammars/folio/FolioLexer.g4
    parser: .canon/grammars/folio/FolioParser.g4
    start: document
  make:
    extensions: [Makefile]
    lexer: .canon/grammars/make/canonically_commented/MakefileLexer.g4
    parser: .canon/grammars/make/canonically_commented/MakefileParser.g4
    start: makefile
  rust:
    extensions: [.rs]
    lexer: .canon/grammars/rust/canonically_commented/RustLexer.g4
    parser: .canon/grammars/rust/canonically_commented/RustParser.g4
    start: crate
  python:
    extensions: [.py]
    lexer: .canon/grammars/python/canonically_commented/Python3Lexer.g4
    parser: .canon/grammars/python/canonically_commented/Python3Parser.g4
    start: file_input
  golang:
    extensions: [.go]
    lexer: .canon/grammars/golang/canonically_commented/GoLexer.g4
    parser: .canon/grammars/golang/canonically_commented/GoParser.g4
    start: sourceFile
  java:
    extensions: [.java]
    lexer: .canon/grammars/java/canonically_commented/JavaLexer.g4
    parser: .canon/grammars/java/canonically_commented/JavaParser.g4
    start: compilationUnit
  kotlin:
    extensions: [.kt]
    lexer: .canon/grammars/kotlin/canonically_commented/KotlinLexer.g4
    parser: .canon/grammars/kotlin/canonically_commented/KotlinParser.g4
    start: kotlinFile
