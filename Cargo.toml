[workspace]
resolver = "3"
members = ["crates/lawtwin", "crates/lawtwin-wire", "twins/kafka/rust", "twins/kafka/conformance", "twins/http/rust", "twins/http/conformance"]
# Each contract's test project is a crate of its own, made by LawSpec. The
# Kafka twin's Rust core depends on the Rust one by path: it runs the very
# code the contract's laws run on.
exclude = ["contracts"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/brain-fuel/lawtwin"

[profile.release]
# The twin image is one static binary; keep it small.
strip = true
lto = "thin"
codegen-units = 4
