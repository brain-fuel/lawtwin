[package]
name = "lawtwin"
description = "LawTwin: contract-governed stand-ins for dependencies you do not control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lawtwin"
path = "src/main.rs"

[dependencies]
lawtwin-wire = { path = "../lawtwin-wire" }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
edn-rs = "=0.17.5"

[dev-dependencies]
# The HTTP twin's Rust core, run in-process by the tests of the HTTP commands.
lawtwin-http = { path = "../../twins/http/rust" }
lawtwin-wire = { path = "../lawtwin-wire" }
serde_json = { version = "1", features = ["preserve_order"] }
