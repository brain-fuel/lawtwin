[package]
name = "lawtwin-http-conformance"
description = "The core conformance kit of the HTTP twin: any core, driven only over HTTP and the admin API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# The reference model, for replaying a core's history, and the Rust core,
# which runs in-process when no core is named.
lawtwin-http = { path = "../rust" }
lawtwin-wire = { path = "../../../crates/lawtwin-wire" }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
# A real client, as applications use one.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
